spring.main.web-application-type=none
spring.main.banner-mode=off

# Central Prodamus backend. Managers do not edit this in the UI.
prodamus.server.base-url=https://prodamus.abs7.ru
prodamus.client.version=2.0.0

logging.level.root=INFO
logging.level.ru.prodamus.client=INFO
logging.level.ru.prodamus.client.gemini=INFO
logging.level.org.springframework=WARN
logging.level.com.sun.jna=INFO
logging.file.name=${LOCALAPPDATA:${user.home}}/Prodamus2/logs/prodamus2-client.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=70MB
logging.charset.console=UTF-8
logging.charset.file=UTF-8
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{42} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{60} - %msg%n
