# ============================================================================
# Prodamus backend
# ============================================================================
spring.application.name=Prodamus Backend
server.port=8080
server.forward-headers-strategy=framework
server.servlet.session.cookie.name=PRODAMUS_ADMIN_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${PRODAMUS_SESSION_SECURE:false}
server.servlet.session.timeout=8h
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-message=never

# PostgreSQL. Non-secret connection defaults are kept here; credentials that
# grant access are supplied only through the production environment file.
spring.datasource.url=jdbc:postgresql://${PRODAMUS_DB_HOST:45.11.92.142}:${PRODAMUS_DB_PORT:5433}/${PRODAMUS_DB_NAME:prodamus}
spring.datasource.username=${PRODAMUS_DB_USER:prodamus_app}
spring.datasource.password=${PRODAMUS_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.keepalive-time=120000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Internal back-office protection. The login may keep the non-secret default,
# but the password is mandatory and must be supplied outside Git.
prodamus.admin.login=${PRODAMUS_ADMIN_LOGIN:admin}
prodamus.admin.password=${PRODAMUS_ADMIN_PASSWORD:secret123}

# AES-256-GCM master key used to encrypt AI credentials in PostgreSQL.
# Mandatory in every runtime environment. Base64 for exactly 32 random bytes.
prodamus.crypto.master-key=${PRODAMUS_MASTER_KEY}

# Client authentication / leasing.
prodamus.auth.access-token-minutes=30
prodamus.auth.refresh-token-hours=24
prodamus.auth.remember-refresh-token-days=7
prodamus.live.lease-seconds=120
prodamus.live.cleanup-delay-ms=30000

# Gemini provisioning. Long-lived Gemini API keys are added in back-office and
# stored encrypted in PostgreSQL; Windows clients receive only ephemeral tokens.
prodamus.gemini.auth-token-url=https://generativelanguage.googleapis.com/v1beta/auth_tokens
prodamus.gemini.websocket-url=wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained
prodamus.gemini.default-model=gemini-3.1-flash-live-preview
prodamus.gemini.token-expire-minutes=60
prodamus.gemini.new-session-expire-seconds=60
prodamus.gemini.http-timeout-seconds=15

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=Prodamus Backend
info.app.version=0.1.0

logging.level.root=INFO
logging.level.ru.prodamus.backend=INFO
logging.file.name=logs/prodamus-backend.log
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=10
